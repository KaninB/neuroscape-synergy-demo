<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>favicon candidates</title>
<style>
  body { margin:0; background:#171A1D; font:14px Verdana,sans-serif; color:#F9FAFB; padding:24px; }
  h1 { font-size:18px; margin:0 0 4px; font-family:Arial,sans-serif; letter-spacing:-.02em; }
  p { margin:0 0 22px; color:#BCC4D0; font-size:12px; }
  .grid { display:flex; gap:26px; flex-wrap:wrap; }
  .card { background:#262B2F; border:1px solid #4B565E; border-radius:6px; padding:16px; text-align:center; }
  .sizes { display:flex; align-items:flex-end; gap:14px; margin-bottom:12px; }
  .row { text-align:center; }
  .row small { display:block; margin-top:6px; color:#BCC4D0; font-size:10px; }
  .box { width:64px; height:64px; border-radius:8px; overflow:hidden; }
  .box img { width:100%; height:100%; display:block; }
</style>
</head>
<body>
<h1>RAM mark — favicon candidates</h1>
<p>Each candidate at 32px, 64px, and 180px. Same mark at all sizes — what matters is how it reads at 32 and 64.</p>
<div class="grid">
  <div class="card"><div class="sizes">
    <div class="row"><div class="box" style="width:32px;height:32px"><img src="favicon-a.svg"></div><small>32</small></div>
    <div class="row"><div class="box" style="width:64px;height:64px"><img src="favicon-a.svg"></div><small>64</small></div>
    <div class="row"><div class="box"><img src="favicon-a.svg"></div><small>180</small></div>
  </div><strong>A — chip + pins</strong></div>
  <div class="card"><div class="sizes">
    <div class="row"><div class="box" style="width:32px;height:32px"><img src="favicon-b.svg"></div><small>32</small></div>
    <div class="row"><div class="box" style="width:64px;height:64px"><img src="favicon-b.svg"></div><small>64</small></div>
    <div class="row"><div class="box"><img src="favicon-b.svg"></div><small>180</small></div>
  </div><strong>B — RAM cell</strong></div>
  <div class="card"><div class="sizes">
    <div class="row"><div class="box" style="width:32px;height:32px"><img src="favicon-c.svg"></div><small>32</small></div>
    <div class="row"><div class="box" style="width:64px;height:64px"><img src="favicon-c.svg"></div><small>64</small></div>
    <div class="row"><div class="box"><img src="favicon-c.svg"></div><small>180</small></div>
  </div><strong>C — teal corner</strong></div>
  <div class="card"><div class="sizes">
    <div class="row"><div class="box" style="width:32px;height:32px"><img src="favicon-d.svg"></div><small>32</small></div>
    <div class="row"><div class="box" style="width:64px;height:64px"><img src="favicon-d.svg"></div><small>64</small></div>
    <div class="row"><div class="box"><img src="favicon-d.svg"></div><small>180</small></div>
  </div><strong>D — curve pulse</strong></div>
</div>
</body>
</html>
