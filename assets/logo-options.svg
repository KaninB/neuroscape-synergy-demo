<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Four RAM logo candidates</title>
  <desc id="desc">A two by two comparison of Circuit RAM, Neural RAM, Stacked RAM, and RAM Core in charcoal, grey, white, and teal.</desc>
  <rect width="1200" height="760" fill="#171A1D"/>
